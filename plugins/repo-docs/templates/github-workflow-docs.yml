# Docs validation — drop into .github/workflows/docs.yml of a repo whose AI docs
# were generated by repo-docs. Validates Markdown, Mermaid, links, and the
# CLAUDE.md size budget on every PR that touches docs.
name: docs

on:
  pull_request:
    paths: ["**/*.md", "CLAUDE.md", "docs/**"]
  push:
    branches: [main]
    paths: ["**/*.md", "CLAUDE.md", "docs/**"]

jobs:
  validate-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Markdown lint
        run: npx -y markdownlint-cli2 "**/*.md" "#node_modules"
      - name: Mermaid validate
        run: npx -y @probelabs/maid .
      - name: Link & path check
        uses: lycheeverse/lychee-action@v2
        with:
          args: --offline --include-fragments "**/*.md"
      - name: CLAUDE.md within verbosity budget
        run: |
          python3 - <<'PY'
          import os, sys
          budget = 32768
          files = [p for p in ["CLAUDE.md"] if os.path.isfile(p)]
          total = sum(os.path.getsize(p) for p in files)
          print(f"CLAUDE.md: {total} bytes (budget {budget})")
          sys.exit(1 if total >= budget else 0)
          PY
  # Advisory drift report (non-blocking): wire repo-docs/scripts/drift_check.py here
  # with continue-on-error: true if the plugin is vendored into the repo.
