# Docs validation — drop into .github/workflows/docs.yml of a repo whose AI docs
# were generated by repo-docs. Validates Markdown, Mermaid, links, and the
# AGENTS.md size budget on every PR that touches docs.
name: docs

on:
  pull_request:
    paths: ["**/*.md", "AGENTS.md", "CLAUDE.md", "docs/**"]
  push:
    branches: [main]
    paths: ["**/*.md", "AGENTS.md", "CLAUDE.md", "docs/**"]

jobs:
  validate-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Markdown lint
        run: npx -y markdownlint-cli2 "**/*.md" "#node_modules"
      - name: Mermaid validate
        run: npx -y @probelabs/maid .
      - name: Link & path check
        uses: lycheeverse/lychee-action@v2
        with:
          args: --offline --include-fragments "**/*.md"
      - name: AGENTS.md under 32 KiB
        run: |
          python3 - <<'PY'
          import os, sys
          chain = [p for p in ["AGENTS.md"] if os.path.isfile(p)]
          total = 0
          for p in chain:
              total += os.path.getsize(p)
          print(f"AGENTS.md chain: {total} bytes (cap 32768)")
          sys.exit(1 if total >= 32768 else 0)
          PY
  # Advisory drift report (non-blocking): wire repo-docs/scripts/drift_check.py here
  # with continue-on-error: true if the plugin is vendored into the repo.
